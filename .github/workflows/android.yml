name: Build JARVIES AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          for f in *.zip; do
            unzip -o "$f" -d project
          done
          find project -name '*.zip' -exec unzip -o {} -d project \;

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$(find project -name settings.gradle -printf '%h\n' | head -1)"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIES-AI-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
